services:
  - type: web
    name: lsi-smart-track
    runtime: docker
    rootDir: LavaLust-dev-v4
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_DRIVER
        value: mysql
      # Render has no managed MySQL, so point these at your own MySQL 8 host
      # (Aiven, PlanetScale, DigitalOcean, or a private server).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      - key: BASE_URL
        value: https://lsi-smart-track.onrender.com
