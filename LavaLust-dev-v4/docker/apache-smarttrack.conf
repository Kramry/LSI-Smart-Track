<VirtualHost *:80>
    ServerName lsi-smart-track.onrender.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Front controller. Any request that is not an existing file or folder is handed
        # to public/index.php, with the original path passed as PATH_INFO. LavaLust routes
        # on REQUEST_URI, so /login, /manage/attendance, /documents/12 and /profile all
        # reach the application instead of a server 404. The conditions use
        # %{REQUEST_FILENAME} so that query strings on static assets
        # (/assets/css/smarttrack.css?v=2) are still served as files.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php/$1 [QSA,L]
    </Directory>

    # Application internals are never served over HTTP.
    <Directory /var/www/html/app>
        Require all denied
    </Directory>
    <Directory /var/www/html/scheme>
        Require all denied
    </Directory>
    <Directory /var/www/html/console>
        Require all denied
    </Directory>
    <Directory /var/www/html/runtime>
        Require all denied
    </Directory>

    # Front controller rules live in the document root Directory block above, so that
    # existing files and folders are served untouched.

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
